name: 🐧 DEBIAN - noVNC (Web Browser)

on:
  workflow_dispatch:
    inputs:
      duration:
        description: '🕐 Thời gian sử dụng'
        required: false
        default: '6h'
        type: choice
        options:
        - '1h'
        - '2h'
        - '3h'
        - '4h'
        - '5h'
        - '6h'
      config:
        description: '⚙️ Cấu hình VPS'
        required: false
        default: 'basic'
        type: choice
        options:
        - 'basic'
        - 'standard'
        - 'premium'

jobs:
  Debian-noVNC:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: 🎯 KHỞI ĐỘNG HỆ THỐNG
        run: |
          echo "🐧 DEBIAN - noVNC (Web Browser Access)"
          echo "🕒 Thời gian: ${{ github.event.inputs.duration }}"

      - name: 🖥️ CÀI ĐẶT DESKTOP & VNC
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 xfce4-goodies tightvncserver novnc websockify \
            curl wget firefox dbus-x11 xterm
          echo "✅ Desktop environment & VNC đã cài đặt"

      - name: 👤 TẠO TÀI KHOẢN
        run: |
          PASSWORD=$(openssl rand -base64 12 | tr -dc 'A-Za-z0-9' | head -c 10)
          sudo useradd -m -s /bin/bash aistv-web
          echo "aistv-web:$PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo aistv-web
          echo "aistv-web ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/aistv-web
          echo "$PASSWORD" > /tmp/vnc_password.txt

      - name: 🚀 KHỞI ĐỘNG VNC SERVER
        run: |
          PASSWORD=$(cat /tmp/vnc_password.txt)
          sudo -u aistv-web mkdir -p /home/aistv-web/.vnc
          echo "$PASSWORD" | sudo -u aistv-web vncpasswd -f > /home/aistv-web/.vnc/passwd
          sudo chmod 600 /home/aistv-web/.vnc/passwd
          sudo chown aistv-web:aistv-web /home/aistv-web/.vnc/passwd
          cat << 'XSTARTUP' | sudo tee /home/aistv-web/.vnc/xstartup
          #!/bin/bash
          xrdb $HOME/.Xresources 2>/dev/null
          startxfce4 &
          XSTARTUP
          sudo chmod +x /home/aistv-web/.vnc/xstartup
          sudo chown -R aistv-web:aistv-web /home/aistv-web/.vnc
          sudo -u aistv-web vncserver :1 -geometry 1920x1080 -depth 24

      - name: 🌐 KHỞI ĐỘNG noVNC + NGROK
        run: |
          websockify --web=/usr/share/novnc/ 6080 localhost:5901 &
          NOVNC_PID=$!
          echo "NOVNC_PID=$NOVNC_PID" >> $GITHUB_ENV
          sleep 3
          
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok-v3-stable-linux-amd64.tgz | tar xz -C /usr/local/bin/
          NGROK_TOKEN="${{ secrets.NGROK_AUTH_TOKEN }}"
          [ -n "$NGROK_TOKEN" ] && ngrok config add-authtoken "$NGROK_TOKEN"
          
          ngrok http 6080 --log=stdout > /tmp/ngrok.log 2>&1 &
          NGROK_PID=$!
          echo "NGROK_PID=$NGROK_PID" >> $GITHUB_ENV
          sleep 8
          
          NGROK_URL=$(curl -s http://localhost:4040/api/tunnels | grep -oP '"public_url":"https://[^"]+' | head -1 | cut -d'"' -f4)
          [ -z "$NGROK_URL" ] && sleep 5 && NGROK_URL=$(curl -s http://localhost:4040/api/tunnels | grep -oP '"public_url":"https://[^"]+' | head -1 | cut -d'"' -f4)
          [ -z "$NGROK_URL" ] && echo "❌ Không thể lấy URL" && exit 1
          
          echo "NOVNC_URL=$NGROK_URL" >> $GITHUB_ENV
          echo "✅ noVNC URL: $NGROK_URL"

      - name: 📤 GỬI THÔNG TIN VỀ WEBSITE
        run: |
          PASSWORD=$(cat /tmp/vnc_password.txt)
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          curl -X POST "https://wxqxriwodkgzpzqaxigp.supabase.co/functions/v1/update-rdp-info" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4cXhyaXdvZGtnenB6cWF4aWdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4Nzk0MDcsImV4cCI6MjA3OTQ1NTQwN30.u8piIXHELUvdN9klNTFhnBFrD0lzwMg0EMPcrz1Wfh8" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4cXhyaXdvZGtnenB6cWF4aWdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4Nzk0MDcsImV4cCI6MjA3OTQ1NTQwN30.u8piIXHELUvdN9klNTFhnBFrD0lzwMg0EMPcrz1Wfh8" \
            -H "Content-Type: application/json" \
            -d "{\"repoName\":\"$REPO_NAME\",\"ngrokUrl\":\"$NOVNC_URL\",\"rdpUser\":\"aistv-web\",\"rdpPassword\":\"$PASSWORD\",\"osType\":\"debian\",\"networkingType\":\"novnc\"}" \
            || echo "⚠️ Lỗi gửi thông tin"

      - name: ⏳ DUY TRÌ PHIÊN
        run: |
          DURATION="${{ github.event.inputs.duration }}"
          HOURS=${DURATION%h}
          MINUTES=$((HOURS * 60))
          while true; do uptime; sleep 60; done &
          KEEPALIVE_PID=$!
          for ((i=MINUTES; i>0; i--)); do
            HOURS_LEFT=$((i / 60)); MINS_LEFT=$((i % 60))
            if ! curl -s http://localhost:4040/api/tunnels > /dev/null 2>&1; then
              ngrok http 6080 --log=stdout > /tmp/ngrok.log 2>&1 &
              sleep 5
            fi
            echo -ne "\r⏱️ Còn lại: ${HOURS_LEFT}h ${MINS_LEFT}m   "
            sleep 60
          done
          kill $KEEPALIVE_PID 2>/dev/null || true

      - name: 🧹 DỌN DẸP
        if: always()
        run: |
          rm -f /tmp/vnc_password.txt
          kill $NOVNC_PID $NGROK_PID 2>/dev/null || true
          sudo -u aistv-web vncserver -kill :1 2>/dev/null || true
