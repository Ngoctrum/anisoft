name: 🖥️ WINDOWS RDP - noVNC (Web Browser)

on:
  workflow_dispatch:
    inputs:
      duration:
        description: '🕐 Thời gian sử dụng'
        required: false
        default: '5h40m'
        type: choice
        options:
        - '1h'
        - '3h'
        - '5h40m'
      config:
        description: '⚙️ Cấu hình VPS'
        required: false
        default: 'basic'
        type: choice
        options:
        - 'basic'
        - 'standard'
        - 'premium'

jobs:
  Windows-noVNC:
    runs-on: windows-latest
    timeout-minutes: 340
    
    steps:
      - name: 🎯 KHỞI ĐỘNG HỆ THỐNG
        run: |
          Write-Host "🖥️ WINDOWS RDP - noVNC (Web Browser Access)" -ForegroundColor Yellow
          Write-Host "🕒 Thời gian: ${{ github.event.inputs.duration }}" -ForegroundColor Magenta

      - name: 🔧 CẤU HÌNH RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389 profile=any
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

      - name: 👤 TẠO TÀI KHOẢN
        run: |
          $chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789'
          $password = -join ((1..10) | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          Remove-LocalUser -Name "AISTV-WEB" -ErrorAction SilentlyContinue
          New-LocalUser -Name "AISTV-WEB" -Password $securePass -AccountNeverExpires
          Set-LocalUser -Name "AISTV-WEB" -PasswordNeverExpires $true
          Add-LocalGroupMember -Group "Administrators" -Member "AISTV-WEB"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "AISTV-WEB"
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV
          echo "$password" > $env:TEMP\rdp_password.txt

      - name: 🌐 CÀI ĐẶT noVNC & VNC SERVER
        run: |
          # Install Chocolatey packages
          choco install -y tigervnc ultravnc --no-progress 2>$null
          
          # Download noVNC
          Invoke-WebRequest -Uri "https://github.com/novnc/noVNC/archive/refs/tags/v1.4.0.zip" -OutFile "$env:TEMP\novnc.zip"
          Expand-Archive -Path "$env:TEMP\novnc.zip" -DestinationPath "$env:TEMP\novnc" -Force
          
          # Download websockify (Python-based, but we'll use the JS one bundled with noVNC)
          # Install Python for websockify
          choco install -y python3 --no-progress
          refreshenv
          pip install websockify numpy 2>$null
          
          Write-Host "✅ noVNC & VNC Server đã cài đặt" -ForegroundColor Green

      - name: 🚀 KHỞI ĐỘNG VNC & noVNC
        run: |
          $password = Get-Content $env:TEMP\rdp_password.txt
          
          # Configure and start VNC server on port 5900
          # Use built-in Windows RDP via websockify pointing to RDP port
          # websockify bridges WebSocket (noVNC) to TCP (RDP/VNC)
          
          $novncPath = Get-ChildItem "$env:TEMP\novnc" -Directory | Select-Object -First 1
          
          # Start websockify to bridge WebSocket to RDP (port 3389)
          $wsProcess = Start-Process -FilePath "python" -ArgumentList "-m websockify --web `"$($novncPath.FullName)`" 6080 localhost:3389" -NoNewWindow -PassThru -RedirectStandardOutput "$env:TEMP\ws.log" -RedirectStandardError "$env:TEMP\ws_err.log"
          
          echo "WS_PID=$($wsProcess.Id)" >> $env:GITHUB_ENV
          Start-Sleep -Seconds 5
          Write-Host "✅ noVNC đang chạy trên port 6080" -ForegroundColor Green

      - name: 🌐 THIẾT LẬP NGROK HTTP TUNNEL
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          # Download ngrok
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "$env:TEMP\ngrok.zip"
          Expand-Archive -Path "$env:TEMP\ngrok.zip" -DestinationPath "$env:TEMP\ngrok" -Force
          $ngrokPath = "$env:TEMP\ngrok\ngrok.exe"
          
          # Auth ngrok
          if ($env:NGROK_AUTH_TOKEN) {
            & $ngrokPath config add-authtoken $env:NGROK_AUTH_TOKEN
          }
          
          # Start ngrok HTTP tunnel (FREE tier supports HTTP!)
          Start-Process -FilePath $ngrokPath -ArgumentList "http 6080 --log=stdout" -NoNewWindow -RedirectStandardOutput "$env:TEMP\ngrok.log"
          Start-Sleep -Seconds 8
          
          # Get public URL from ngrok API
          try {
            $tunnels = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -ErrorAction Stop
            $publicUrl = $tunnels.tunnels | Where-Object { $_.proto -eq "https" } | Select-Object -First 1 -ExpandProperty public_url
            if (-not $publicUrl) {
              $publicUrl = $tunnels.tunnels[0].public_url
            }
          } catch {
            Start-Sleep -Seconds 5
            $tunnels = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels"
            $publicUrl = $tunnels.tunnels[0].public_url
          }
          
          echo "NOVNC_URL=$publicUrl" >> $env:GITHUB_ENV
          Write-Host "✅ noVNC URL: $publicUrl" -ForegroundColor Green

      - name: 📤 GỬI THÔNG TIN VỀ WEBSITE
        run: |
          $password = Get-Content $env:TEMP\rdp_password.txt
          $repoName = "${{ github.repository }}".Split('/')[-1]
          
          $body = @{
              repoName = $repoName
              ngrokUrl = $env:NOVNC_URL
              rdpUser = "AISTV-WEB"
              rdpPassword = $password
              osType = "windows"
              networkingType = "novnc"
          } | ConvertTo-Json
          
          try {
              Invoke-RestMethod -Uri "https://wxqxriwodkgzpzqaxigp.supabase.co/functions/v1/update-rdp-info" -Method POST -Body $body -ContentType "application/json" -Headers @{
                  "apikey" = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4cXhyaXdvZGtnenB6cWF4aWdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4Nzk0MDcsImV4cCI6MjA3OTQ1NTQwN30.u8piIXHELUvdN9klNTFhnBFrD0lzwMg0EMPcrz1Wfh8"
                  "Authorization" = "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4cXhyaXdvZGtnenB6cWF4aWdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4Nzk0MDcsImV4cCI6MjA3OTQ1NTQwN30.u8piIXHELUvdN9klNTFhnBFrD0lzwMg0EMPcrz1Wfh8"
              }
          } catch {
              Write-Host "⚠️ Lỗi gửi thông tin" -ForegroundColor Yellow
          }

      - name: 🎉 THÔNG TIN KẾT NỐI
        run: |
          $password = Get-Content $env:TEMP\rdp_password.txt
          Write-Host "🌐 noVNC URL: $env:NOVNC_URL/vnc.html"
          Write-Host "👤 User: AISTV-WEB | 🔐 Pass: $password"
          Write-Host "💡 Mở URL trên trình duyệt - KHÔNG CẦN CÀI APP!"

      - name: ⏳ DUY TRÌ PHIÊN LÀM VIỆC
        run: |
          $durationInput = "${{ github.event.inputs.duration }}"
          switch ($durationInput) {
              "1h" { $totalMinutes = 60 }
              "3h" { $totalMinutes = 180 }
              "5h40m" { $totalMinutes = 340 }
          }
          
          $keepAliveJob = Start-Job -ScriptBlock { while($true) { Get-Date | Out-Null; Start-Sleep -Seconds 60 } }
          
          for($i=$totalMinutes; $i -gt 0; $i--) {
              $hours = [math]::Floor($i / 60)
              $mins = $i % 60
              Write-Host "`r⏱️ Còn lại: ${hours}h ${mins}m   " -NoNewline -ForegroundColor Blue
              Start-Sleep -Seconds 60
          }
          
          Stop-Job -Job $keepAliveJob -ErrorAction SilentlyContinue
          Remove-Job -Job $keepAliveJob -ErrorAction SilentlyContinue

      - name: 🧹 DỌN DẸP
        if: always()
        run: |
          Stop-Process -Id $env:WS_PID -ErrorAction SilentlyContinue
          Remove-Item "$env:TEMP\rdp_password.txt" -ErrorAction SilentlyContinue
