name: ⚡ ARCH LINUX SSH SERVER (Rolling Release)

on:
  workflow_dispatch:
    inputs:
      duration:
        description: '🕐 Thời gian sử dụng'
        required: false
        default: '6h'
        type: choice
        options:
        - '1h'
        - '2h'
        - '3h'
        - '4h'
        - '5h'
        - '6h'
      config:
        description: '⚙️ Cấu hình VPS'
        required: false
        default: 'basic'
        type: choice
        options:
        - 'basic'
        - 'standard'
        - 'premium'

jobs:
  ArchLinux-SSH-Setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    
    steps:
      - name: 🎯 KHỞI ĐỘNG HỆ THỐNG ARCH LINUX
        run: |
          echo "⚡ ARCH LINUX SSH SERVER (Rolling Release)"
          echo "⚡ Powered by AI STV"
          echo "🕒 Thời gian: ${{ github.event.inputs.duration }}"
          echo "⚙️ Cấu hình: ${{ github.event.inputs.config }}"

      - name: 🔧 CẤU HÌNH HỆ THỐNG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openssh-server curl
          
          sudo sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?PubkeyAuthentication.*/PubkeyAuthentication yes/' /etc/ssh/sshd_config
          echo "ClientAliveInterval 30" | sudo tee -a /etc/ssh/sshd_config
          echo "ClientAliveCountMax 99999" | sudo tee -a /etc/ssh/sshd_config
          echo "TCPKeepAlive yes" | sudo tee -a /etc/ssh/sshd_config
          
          sudo systemctl restart ssh
          sudo systemctl enable ssh

      - name: 👤 TẠO TÀI KHOẢN SSH
        run: |
          PASSWORD=$(openssl rand -base64 12 | tr -dc 'A-Za-z0-9' | head -c 10)
          sudo useradd -m -s /bin/bash aistv-arch
          echo "aistv-arch:$PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo aistv-arch
          echo "aistv-arch ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/aistv-arch
          echo "SSH_USER=aistv-arch" >> $GITHUB_ENV
          echo "$PASSWORD" > /tmp/ssh_password.txt

      - name: 📊 THU THẬP THÔNG TIN HỆ THỐNG
        run: |
          PUBLIC_IP=$(curl -s ifconfig.me || curl -s ipinfo.io/ip || echo "N/A")
          HOSTNAME_INFO=$(hostname)
          OS_VERSION=$(cat /etc/os-release | grep PRETTY_NAME | cut -d'"' -f2)
          KERNEL_VERSION=$(uname -r)
          CPU_MODEL=$(grep "model name" /proc/cpuinfo | head -1 | cut -d':' -f2 | xargs)
          CPU_CORES=$(nproc)
          TOTAL_RAM=$(free -h | grep Mem | awk '{print $2}')
          DISK_TOTAL=$(df -h / | tail -1 | awk '{print $2}')
          DISK_USED=$(df -h / | tail -1 | awk '{print $3}')
          DISK_AVAIL=$(df -h / | tail -1 | awk '{print $4}')
          ARCH=$(uname -m)
          
          for var in PUBLIC_IP HOSTNAME_INFO OS_VERSION KERNEL_VERSION CPU_MODEL CPU_CORES TOTAL_RAM DISK_TOTAL DISK_USED DISK_AVAIL ARCH; do
            echo "$var=${!var}" >> $GITHUB_ENV
          done

      - name: 🌐 THIẾT LẬP MẠNG TAILSCALE
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=$TAILSCALE_AUTH_KEY --hostname=ai-stv-arch-$GITHUB_RUN_ID --accept-routes --accept-dns --reset
          sleep 10
          TAILSCALE_IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$TAILSCALE_IP" >> $GITHUB_ENV

      - name: 📤 GỬI THÔNG TIN VỀ WEBSITE
        run: |
          PASSWORD=$(cat /tmp/ssh_password.txt)
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          
          SYSTEM_INFO="{\"publicIp\":\"$PUBLIC_IP\",\"hostname\":\"$HOSTNAME_INFO\",\"osVersion\":\"$OS_VERSION\",\"kernel\":\"$KERNEL_VERSION\",\"cpuModel\":\"$CPU_MODEL\",\"cpuCores\":\"$CPU_CORES\",\"totalRam\":\"$TOTAL_RAM\",\"diskTotal\":\"$DISK_TOTAL\",\"diskUsed\":\"$DISK_USED\",\"diskAvail\":\"$DISK_AVAIL\",\"arch\":\"$ARCH\"}"
          
          curl -X POST "https://wxqxriwodkgzpzqaxigp.supabase.co/functions/v1/update-rdp-info" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4cXhyaXdvZGtnenB6cWF4aWdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4Nzk0MDcsImV4cCI6MjA3OTQ1NTQwN30.u8piIXHELUvdN9klNTFhnBFrD0lzwMg0EMPcrz1Wfh8" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4cXhyaXdvZGtnenB6cWF4aWdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4Nzk0MDcsImV4cCI6MjA3OTQ1NTQwN30.u8piIXHELUvdN9klNTFhnBFrD0lzwMg0EMPcrz1Wfh8" \
            -H "Content-Type: application/json" \
            -d "{\"repoName\":\"$REPO_NAME\",\"ngrokUrl\":\"$TAILSCALE_IP\",\"rdpUser\":\"aistv-arch\",\"rdpPassword\":\"$PASSWORD\",\"osType\":\"archlinux\",\"sshPort\":22,\"systemInfo\":$SYSTEM_INFO}" \
            || echo "⚠️ Lỗi gửi thông tin"

      - name: 🎉 THÔNG TIN KẾT NỐI
        run: |
          PASSWORD=$(cat /tmp/ssh_password.txt)
          DURATION="${{ github.event.inputs.duration }}"
          HOURS=${DURATION%h}
          
          echo ""
          echo "┌───────────────────────────────────────────┐"
          echo "│     🎉 ARCH LINUX SSH ĐÃ SẴN SÀNG!        │"
          echo "├───────────────────────────────────────────┤"
          echo "│ 🌐  Tailscale IP: $TAILSCALE_IP"
          echo "│ 🌍  Public IP: $PUBLIC_IP"
          echo "│ 👤  User: aistv-arch"
          echo "│ 🔐  Password: $PASSWORD"
          echo "│ ⏰  Thời lượng: $HOURS giờ"
          echo "│ 🔌  SSH Port: 22"
          echo "├───────────────────────────────────────────┤"
          echo "│ 💻  OS: $OS_VERSION | Kernel: $KERNEL_VERSION"
          echo "│ 🔧  CPU: $CPU_MODEL ($CPU_CORES cores)"
          echo "│ 💾  RAM: $TOTAL_RAM | Disk: $DISK_AVAIL free"
          echo "├───────────────────────────────────────────┤"
          echo "│ 💡  ssh aistv-arch@$TAILSCALE_IP"
          echo "└───────────────────────────────────────────┘"

      - name: ⏳ DUY TRÌ PHIÊN LÀM VIỆC
        run: |
          DURATION="${{ github.event.inputs.duration }}"
          HOURS=${DURATION%h}
          MINUTES=$((HOURS * 60))
          
          for ((i=MINUTES; i>0; i--)); do
            HOURS_LEFT=$((i / 60))
            MINS_LEFT=$((i % 60))
            echo -ne "\r⏱️ Còn lại: ${HOURS_LEFT}h ${MINS_LEFT}m   "
            sleep 60
          done
          echo ""
          echo "🎯 ĐÃ HẾT THỜI GIAN!"

      - name: 🧹 DỌN DẸP HỆ THỐNG
        if: always()
        run: |
          rm -f /tmp/ssh_password.txt
          sudo tailscale down --accept-risk=all || true
