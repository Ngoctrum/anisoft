name: 🖥️ WINDOWS RDP - noVNC (Web Browser)

on:
  workflow_dispatch:
    inputs:
      duration:
        description: '🕐 Thời gian sử dụng'
        required: false
        default: '5h40m'
        type: choice
        options:
        - '1h'
        - '3h'
        - '5h40m'
      config:
        description: '⚙️ Cấu hình VPS'
        required: false
        default: 'basic'
        type: choice
        options:
        - 'basic'
        - 'standard'
        - 'premium'

jobs:
  Windows-noVNC:
    runs-on: windows-latest
    timeout-minutes: 340
    
    steps:
      - name: 🎯 KHỞI ĐỘNG HỆ THỐNG
        run: |
          Write-Host "🖥️ WINDOWS RDP - noVNC (Web Browser Access)" -ForegroundColor Yellow
          Write-Host "🕒 Thời gian: ${{ github.event.inputs.duration }}" -ForegroundColor Magenta

      - name: 🔧 CẤU HÌNH RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389 profile=any
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

      - name: 👤 TẠO TÀI KHOẢN
        run: |
          function New-RdpPassword {
              param()
              $upper = 'ABCDEFGHJKLMNPQRSTUVWXYZ'
              $lower = 'abcdefghijkmnpqrstuvwxyz'
              $numbers = '23456789'
              $special = '!@#$%&*'
              $all = $upper + $lower + $numbers
              $pw = ''
              $pw += $upper[(Get-Random -Minimum 0 -Maximum $upper.Length)]
              $pw += $lower[(Get-Random -Minimum 0 -Maximum $lower.Length)]
              $pw += $numbers[(Get-Random -Minimum 0 -Maximum $numbers.Length)]
              $pw += $special[(Get-Random -Minimum 0 -Maximum $special.Length)]
              for ($i = 1; $i -le 6; $i++) {
                  $pw += $all[(Get-Random -Minimum 0 -Maximum $all.Length)]
              }
              return -join ($pw.ToCharArray() | Sort-Object { Get-Random })
          }

          $matKhau = New-RdpPassword
          $matKhau | Out-File -FilePath "$env:TEMP\rdp_password.txt" -NoNewline

          try {
              Remove-LocalUser -Name "AISTV-WEB" -ErrorAction SilentlyContinue
          } catch {}

          try {
              $securePass = ConvertTo-SecureString $matKhau -AsPlainText -Force
              New-LocalUser -Name "AISTV-WEB" -Password $securePass -AccountNeverExpires -Description "AI STV noVNC Account"
              Set-LocalUser -Name "AISTV-WEB" -PasswordNeverExpires $true -ErrorAction SilentlyContinue
              Add-LocalGroupMember -Group "Administrators" -Member "AISTV-WEB" -ErrorAction SilentlyContinue
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member "AISTV-WEB" -ErrorAction SilentlyContinue
              Enable-LocalUser -Name "AISTV-WEB"
              Write-Host "✅ Tài khoản AISTV-WEB đã sẵn sàng" -ForegroundColor Green
          } catch {
              Write-Host "❌ Lỗi tạo tài khoản: $_" -ForegroundColor Red
              exit 1
          }

      - name: 🌐 CÀI ĐẶT noVNC & WEBSOCKIFY
        run: |
          choco install -y python3 --no-progress 2>$null
          refreshenv
          $env:PATH = "C:\Python312;C:\Python312\Scripts;C:\Python311;C:\Python311\Scripts;C:\Python310;C:\Python310\Scripts;" + $env:PATH
          pip install websockify numpy 2>$null
          
          Invoke-WebRequest -Uri "https://github.com/novnc/noVNC/archive/refs/tags/v1.4.0.zip" -OutFile "$env:TEMP\novnc.zip"
          Expand-Archive -Path "$env:TEMP\novnc.zip" -DestinationPath "$env:TEMP\novnc" -Force
          
          Write-Host "✅ noVNC & websockify đã cài đặt" -ForegroundColor Green

      - name: 🚀 KHỞI ĐỘNG WEBSOCKIFY + noVNC
        run: |
          $novncPath = Get-ChildItem "$env:TEMP\novnc" -Directory | Select-Object -First 1
          $env:PATH = "C:\Python312;C:\Python312\Scripts;C:\Python311;C:\Python311\Scripts;C:\Python310;C:\Python310\Scripts;" + $env:PATH
          Start-Process -FilePath "python" -ArgumentList "-m websockify --web `"$($novncPath.FullName)`" 6080 localhost:3389" -NoNewWindow -RedirectStandardOutput "$env:TEMP\ws.log" -RedirectStandardError "$env:TEMP\ws_err.log"
          Start-Sleep -Seconds 5
          Write-Host "✅ noVNC đang chạy trên port 6080" -ForegroundColor Green

      - name: 🌐 THIẾT LẬP CLOUDFLARE QUICK TUNNEL
        run: |
          # Download cloudflared
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "$env:TEMP\cloudflared.exe"
          
          # Start quick tunnel (no token needed)
          Start-Process -FilePath "$env:TEMP\cloudflared.exe" -ArgumentList "tunnel --url http://localhost:6080 --no-autoupdate" -NoNewWindow -RedirectStandardOutput "$env:TEMP\cf.log" -RedirectStandardError "$env:TEMP\cf_err.log"
          
          # Wait and extract URL from stderr (cloudflared logs to stderr)
          $publicUrl = $null
          for ($i = 1; $i -le 30; $i++) {
            Start-Sleep -Seconds 2
            if (Test-Path "$env:TEMP\cf_err.log") {
              $content = Get-Content "$env:TEMP\cf_err.log" -Raw -ErrorAction SilentlyContinue
              if ($content -match '(https://[a-z0-9\-]+\.trycloudflare\.com)') {
                $publicUrl = $Matches[1]
                break
              }
            }
            if (Test-Path "$env:TEMP\cf.log") {
              $content = Get-Content "$env:TEMP\cf.log" -Raw -ErrorAction SilentlyContinue
              if ($content -match '(https://[a-z0-9\-]+\.trycloudflare\.com)') {
                $publicUrl = $Matches[1]
                break
              }
            }
          }
          
          if (-not $publicUrl) {
            Write-Host "❌ Không thể lấy tunnel URL" -ForegroundColor Red
            if (Test-Path "$env:TEMP\cf_err.log") { Get-Content "$env:TEMP\cf_err.log" }
            if (Test-Path "$env:TEMP\cf.log") { Get-Content "$env:TEMP\cf.log" }
            exit 1
          }
          
          echo "NOVNC_URL=$publicUrl" >> $env:GITHUB_ENV
          Write-Host "✅ noVNC URL: $publicUrl" -ForegroundColor Green

      - name: 📤 GỬI THÔNG TIN VỀ WEBSITE
        run: |
          $password = Get-Content $env:TEMP\rdp_password.txt
          $repoName = "${{ github.repository }}".Split('/')[-1]
          
          $body = @{
              repoName = $repoName
              ngrokUrl = $env:NOVNC_URL
              rdpUser = "AISTV-WEB"
              rdpPassword = $password
              osType = "windows"
              networkingType = "novnc"
          } | ConvertTo-Json
          
          try {
              Invoke-RestMethod -Uri "https://wxqxriwodkgzpzqaxigp.supabase.co/functions/v1/update-rdp-info" -Method POST -Body $body -ContentType "application/json" -Headers @{
                  "apikey" = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4cXhyaXdvZGtnenB6cWF4aWdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4Nzk0MDcsImV4cCI6MjA3OTQ1NTQwN30.u8piIXHELUvdN9klNTFhnBFrD0lzwMg0EMPcrz1Wfh8"
                  "Authorization" = "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4cXhyaXdvZGtnenB6cWF4aWdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4Nzk0MDcsImV4cCI6MjA3OTQ1NTQwN30.u8piIXHELUvdN9klNTFhnBFrD0lzwMg0EMPcrz1Wfh8"
              }
              Write-Host "✅ Đã gửi thông tin!" -ForegroundColor Green
          } catch {
              Write-Host "⚠️ Lỗi gửi thông tin: $_" -ForegroundColor Yellow
          }

      - name: 🎉 THÔNG TIN KẾT NỐI
        run: |
          $password = Get-Content $env:TEMP\rdp_password.txt
          Write-Host "🌐 noVNC URL: $env:NOVNC_URL/vnc.html"
          Write-Host "👤 User: AISTV-WEB | 🔐 Pass: $password"
          Write-Host "💡 Mở URL trên trình duyệt - KHÔNG CẦN CÀI APP!"

      - name: ⏳ DUY TRÌ PHIÊN LÀM VIỆC
        run: |
          $durationInput = "${{ github.event.inputs.duration }}"
          switch ($durationInput) {
              "1h" { $totalMinutes = 60 }
              "3h" { $totalMinutes = 180 }
              "5h40m" { $totalMinutes = 340 }
          }
          
          $keepAliveJob = Start-Job -ScriptBlock { while($true) { Get-Date | Out-Null; Start-Sleep -Seconds 60 } }
          
          for($i=$totalMinutes; $i -gt 0; $i--) {
              $hours = [math]::Floor($i / 60)
              $mins = $i % 60
              Write-Host "`r⏱️ Còn lại: ${hours}h ${mins}m   " -NoNewline -ForegroundColor Blue
              Start-Sleep -Seconds 60
          }
          
          Stop-Job -Job $keepAliveJob -ErrorAction SilentlyContinue
          Remove-Job -Job $keepAliveJob -ErrorAction SilentlyContinue

      - name: 🧹 DỌN DẸP
        if: always()
        run: |
          Remove-Item "$env:TEMP\rdp_password.txt" -ErrorAction SilentlyContinue

      - name: ❌ BÁO LỖI VỀ WEBSITE
        if: failure()
        run: |
          $repoName = "${{ github.repository }}".Split('/')[-1]
          $body = @{
              repoName = $repoName
              status = "failed"
          } | ConvertTo-Json
          
          try {
              Invoke-RestMethod -Uri "https://wxqxriwodkgzpzqaxigp.supabase.co/functions/v1/update-rdp-info" -Method POST -Body $body -ContentType "application/json" -Headers @{
                  "apikey" = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4cXhyaXdvZGtnenB6cWF4aWdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4Nzk0MDcsImV4cCI6MjA3OTQ1NTQwN30.u8piIXHELUvdN9klNTFhnBFrD0lzwMg0EMPcrz1Wfh8"
                  "Authorization" = "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4cXhyaXdvZGtnenB6cWF4aWdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4Nzk0MDcsImV4cCI6MjA3OTQ1NTQwN30.u8piIXHELUvdN9klNTFhnBFrD0lzwMg0EMPcrz1Wfh8"
              }
          } catch {}
